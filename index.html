<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watermark & Share</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f0f2f5; text-align: center; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 15px; background: #25d366; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #128c7e; }
        .result-item { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .preview-img { width: 100%; max-width: 400px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .share-btn { background: #387ed1; margin-bottom: 20px; width: auto; padding: 10px 25px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Watermark & Share</h2>
    
    <div class="input-group">
        <label>Watermark Text</label>
        <input type="text" id="watermarkText" value="A101670350R100F * SOFT PURE CAMBRIC COTTON">
    </div>

    <div class="input-group">
        <label>Select Images</label>
        <input type="file" id="imageInput" accept="image/*" multiple>
    </div>

    <button onclick="processImages()">Apply Watermark to All</button>

    <div id="outputArea"></div>
</div>

<script>
    async function processImages() {
        const files = document.getElementById('imageInput').files;
        const text = document.getElementById('watermarkText').value;
        const outputArea = document.getElementById('outputArea');
        
        if (files.length === 0) return alert("Select images!");
        outputArea.innerHTML = "<p>Processing...</p>";

        for (let i = 0; i < files.length; i++) {
            const img = await loadImage(files[i]);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // Text styling matching your Python logic
            const fontSize = Math.floor(canvas.width * 0.04);
            ctx.font = `bold ${fontSize}px Arial`;
            const margin = canvas.width * 0.02;
            const shadow = Math.max(1, fontSize * 0.05);

            // Draw Shadow & Text
            ctx.fillStyle = 'black';
            ctx.fillText(text, margin + shadow, margin + shadow + fontSize);
            ctx.fillStyle = 'white';
            ctx.fillText(text, margin, margin + fontSize);

            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            const file = new File([blob], `${text.substring(0,20)}_${i+1}.jpg`, { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);

            // Create display element
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `
                <img src="${url}" class="preview-img"><br>
                <button class="share-btn" onclick="shareFile('${i}')">Share Image ${i+1}</button>
            `;
            
            // Store file for sharing
            item.dataset.fileIndex = i;
            window[`file_${i}`] = file;
            
            outputArea.appendChild(item);
        }
        outputArea.firstChild.remove(); // Remove "Processing..."
    }

    async function shareFile(index) {
        const file = window[`file_${index}`];
        
        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Watermarked Fabric',
                    text: document.getElementById('watermarkText').value
                });
            } catch (err) {
                console.log("Share failed:", err);
            }
        } else {
            alert("Your browser doesn't support direct sharing. Please long-press the image to save/share.");
        }
    }

    function loadImage(file) {
        return new Promise(r => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => r(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
